spring:
  application:
    name: backend
  config:
    # 로컬 실행(backend/ 에서 ./gradlew bootRun) 시 저장소 루트의 .env 를 읽는다. 없으면 무시.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:capstone}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:capstone}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:capstone}}
  flyway:
    # V1 schema · V2 · V100 seed 이후 backend 변경은 V101 부터 (이미 v100 인 DB 에도 그대로 이어서 적용됨)
    default-schema: app
    schemas: app
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: messages
    fallback-to-system-locale: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        # 처리 실패 메시지를 무한 반복하지 않는다 (재시도는 retry 큐 규약으로 처리)
        default-requeue-rejected: false
        missing-queues-fatal: false

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-32-byte-or-longer-random-string}
    issuer: capstone-backend
    access-ttl: 30m
    refresh-ttl: 14d
  refresh-cookie:
    name: refresh_token
    path: /api/auth
    secure: false
  service-token: ${SERVICE_TOKEN:change-me-internal-service-token}
  cors:
    allowed-origins: http://localhost,http://localhost:80,http://localhost:5173
  agent:
    # /api/docs/{docId} 문서 원문 조회 시 backend → agent 내부 HTTP
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    timeout: 3s
  ai:
    # QUEUED/RUNNING 상태로 이 시간 넘게 진행이 없으면 FAILED (agent 장애 시 무한 대기 방지)
    task-timeout: 5m
  reservation:
    hold: 30m
  trip:
    # 일정 적합성: 회복 완료 후 출국까지 최소 여유일 (03 문서 9-2)
    min-buffer-days: ${TRIP_MIN_BUFFER_DAYS:1}
  seed:
    # PasswordSeeder: mock 사용자의 {bcrypt}PLACEHOLDER 를 이 비밀번호의 BCrypt 해시로 교체 (로컬 데모 전용)
    demo-password: Passw0rd!

springdoc:
  swagger-ui:
    path: /swagger-ui
