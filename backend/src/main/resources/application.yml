spring:
  application:
    name: backend
  config:
    # 로컬 실행(backend/ 에서 ./gradlew bootRun) 시 저장소 루트의 .env 를 읽는다. 없으면 무시.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:capstone}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:capstone}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:capstone}}
  flyway:
    default-schema: app
    schemas: app
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: messages
    fallback-to-system-locale: false

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-32-byte-or-longer-random-string}
    issuer: capstone-backend
    access-ttl: 30m
    refresh-ttl: 14d
  refresh-cookie:
    name: refresh_token
    path: /api/auth
    secure: false
  service-token: ${SERVICE_TOKEN:change-me-internal-service-token}
  cors:
    allowed-origins: http://localhost,http://localhost:80,http://localhost:5173
  seed:
    # PasswordSeeder: mock 사용자의 {bcrypt}PLACEHOLDER 를 이 비밀번호의 BCrypt 해시로 교체 (로컬 데모 전용)
    demo-password: Passw0rd!

springdoc:
  swagger-ui:
    path: /swagger-ui
