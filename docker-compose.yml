# 공개 포트는 frontend(80), backend(8080). 내부 포트는 docker-compose.dev.yml로 노출한다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
    volumes:
      # 스키마·mock 데이터 적재는 backend 기동 시 Flyway 가 한다 (V1 schema → V2.. → V100 seed)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone} -d ${POSTGRES_DB:-capstone}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # backend 없이 DB만 채우기 (agent·MCP·RAG 담당용): docker compose run --rm db-seed
  # backend 와 같은 Flyway 버전·같은 파일이라 나중에 backend 를 띄워도 이력이 그대로 이어진다.
  # 데모 계정 비밀번호(PasswordSeeder)는 backend 기동 시에만 채워진다 → 로그인이 필요하면 backend 를 띄울 것.
  db-seed:
    image: flyway/flyway:11.7.2-alpine
    profiles: ["tools"]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-capstone}
      FLYWAY_USER: ${POSTGRES_USER:-capstone}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      FLYWAY_SCHEMAS: app
      FLYWAY_DEFAULT_SCHEMA: app
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./data/mock/out/schema.sql:/flyway/sql/V1__schema.sql:ro
      - ./backend/src/main/resources/db/migration:/flyway/sql/backend:ro
      - ./data/mock/out/V100__seed.sql:/flyway/sql/V100__seed.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-capstone}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-capstone}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-or-longer-random-string}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
      # RabbitMQ: backend 가 기동 시 exchange·큐·DLQ·재시도 큐를 선언한다 (「Backend API 상세 명세」 10장)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      # 근거 문서 원문(/api/docs) 조회용. agent 가 아직 없으면 그 API 만 503
      AGENT_BASE_URL: http://agent:8000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Flyway 이후 전용 계정·권한을 준비한다. 기존 데이터와 계정 비밀번호는 덮어쓰지 않는다.
  db-access:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "/infra/init_db.py"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      DATABASE_URL: ${DATABASE_URL:?Set agent DATABASE_URL in .env}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set RAG_DATABASE_URL in .env}
      RAG_INDEX_DATABASE_URL: ${RAG_INDEX_DATABASE_URL:?Set RAG_INDEX_DATABASE_URL in .env}
    volumes:
      - ./infra/init_db.py:/infra/init_db.py:ro
    depends_on:
      backend:
        condition: service_healthy

  business-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "-m", "business_mcp.server"]
    environment:
      USE_STUB: "false"
      BACKEND_INTERNAL_URL: http://backend:8080/internal
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-internal-service-token}
    volumes:
      - ./infra/check_mcp.py:/infra/check_mcp.py:ro
    healthcheck:
      test: ["CMD", "python", "/infra/check_mcp.py", "http://localhost:9101/mcp"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  # 최초·재기동 모두 같은 절차. 변경 없는 문서는 재임베딩하지 않는다.
  rag-index:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "-m", "rag_mcp.indexer"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_INDEX_DATABASE_URL: ${RAG_INDEX_DATABASE_URL:?Set RAG_INDEX_DATABASE_URL in .env}
    depends_on:
      db-access:
        condition: service_completed_successfully

  rag-mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    command: ["python", "-m", "rag_mcp.server"]
    environment:
      USE_STUB: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set RAG_DATABASE_URL in .env}
    volumes:
      - ./infra/check_mcp.py:/infra/check_mcp.py:ro
    healthcheck:
      test: ["CMD", "python", "/infra/check_mcp.py", "http://localhost:9102/mcp"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      rag-index:
        condition: service_completed_successfully

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gpt-5-nano}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-5-nano}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-5-nano}
      DATABASE_URL: ${DATABASE_URL:?Set agent DATABASE_URL in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      USE_FAKE_TOOLS: "false"
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      SUMMARIZER_URL: http://summarizer:8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      business-mcp:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy
      summarizer:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      agent:
        condition: service_healthy
      translator:
        condition: service_healthy

  # 공용 에이전트: 통역 채팅·요약 카드 번역 워커 (chat.translate/summary.translate 소비)
  translator:
    build:
      context: .
      dockerfile: translator/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-5-nano}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy   # 큐 선언 주체가 backend 라서

  # 공용 에이전트: 상담 요청 요약 카드 (POST /summarize — agent 그래프 노드가 동기 호출)
  summarizer:
    build:
      context: .
      dockerfile: summarizer/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-5-nano}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
