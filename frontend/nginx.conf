# frontend 컨테이너(80) — 정적 파일 + /api, /ws 를 backend(8080)로 프록시 (07 문서 1장)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # backend 를 시작 시점이 아니라 요청 시점에 찾는다 (Docker 내장 DNS).
    # proxy_pass 에 호스트를 직접 쓰면 backend 가 아직 없을 때 nginx 가 기동 실패(host not found)한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # AI 작업 SSE: 버퍼링 끄고 오래 열어 둔다 (/api/ai/tasks/{id}/stream)
    location ~ ^/api/ai/tasks/[^/]+/stream$ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA history 모드
    location / {
        try_files $uri $uri/ /index.html;
    }
}
