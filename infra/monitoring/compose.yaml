name: capstone-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana.yaml:/etc/grafana/provisioning/datasources/sources.yaml:ro
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/performance.json:ro
    ports: ["127.0.0.1:13000:3000"]
  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./loki.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
  alloy:
    image: grafana/alloy:v1.11.3
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
  measurements:
    image: python:3.12-slim
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ${PERF_RESULTS_DIR:?Set PERF_RESULTS_DIR}:/results:ro
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
