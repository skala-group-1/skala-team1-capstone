[project]
name = "capstone-mcp"
version = "0.1.0"
description = "SKALA 1조 캡스톤 MCP 서버 (business-mcp, rag-mcp)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=2.12",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
