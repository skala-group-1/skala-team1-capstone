[project]
name = "capstone-translator"
version = "0.1.0"
description = "SKALA team1 capstone - 공용 번역 에이전트 (통역 채팅 번역 + 요약 카드 한국어 번역 워커)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-openai>=0.3",
    "aio-pika>=9.4",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
